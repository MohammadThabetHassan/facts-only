name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Offline test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax check all JS files
        run: |
          fail=0
          while IFS= read -r -d '' f; do
            node --check "$f" || fail=1
          done < <(find . -name '*.js' -not -path './node_modules/*' -print0)
          exit $fail

      - name: Run offline pipeline tests
        run: node test/smoke.mjs

      - name: Validate JSON files
        run: |
          node -e "JSON.parse(require('fs').readFileSync('extension/manifest.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('eval/corpus.json','utf8'))"

      # Every defect found by live testing on this project has been a rendering
      # failure that a unit suite passes: a broken module graph, a renderer
      # crash, a component resetting page direction. So the real DOM is checked
      # in CI too, in headless Chrome, with no test framework.
      - name: Real-browser end-to-end checks
        run: node test/e2e.mjs

      # The detector's accuracy is a build gate, not a claim in a README.
      # Offline and deterministic: real archive histories are committed in
      # eval/corpus.json, so this needs no key and no network.
      - name: Evaluate the placement detector
        run: node eval/run.mjs

      - name: Type-check and lint the engine (no build step, dev-only tooling)
        run: |
          npm install --no-save typescript@5.6 @types/node@22 eslint@9
          npx tsc -p jsconfig.json
          npx eslint .
